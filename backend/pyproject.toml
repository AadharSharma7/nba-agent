[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-agent"
version = "0.1.0"
description = "Local, evidence-grounded NBA statistical assistant"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.143.0", "uvicorn[standard]==0.54.0",
  "pydantic-ai-slim[openai]==2.55.0", "pydantic-settings==2.15.0",
  "psycopg[binary,pool]==3.3.6",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "httpx==0.28.1", "ruff==0.17.0"]

[project.scripts]
nba-agent = "nba_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nba_agent = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires the initialized local NBA database"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
